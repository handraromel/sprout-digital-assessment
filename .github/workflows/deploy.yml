name: Sprout Digital Assessment CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOCKER_API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sprout-digital-assessment-api
  DOCKER_UI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sprout-digital-assessment-ui
  DOCKER_NGINX_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sprout-digital-assessment-nginx

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            api/package-lock.json
            ui/package-lock.json

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Run UI lint
        run: cd ui && npm run lint
        continue-on-error: true

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Generate Prisma Client
        run: cd api && npx prisma generate

      - name: Build API (TypeScript check)
        run: cd api && npm run build

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: sprout-digital-assessment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_API_IMAGE }}:latest
            ${{ env.DOCKER_API_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_API_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_API_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_UI_IMAGE }}:latest
            ${{ env.DOCKER_UI_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_UI_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_UI_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_NGINX_IMAGE }}:latest
            ${{ env.DOCKER_NGINX_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_NGINX_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_NGINX_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: sprout-digital-assessment

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,NODE_ENV,JWT_SECRET,JWT_REFRESH_SECRET,JWT_ACCESS_EXPIRY,JWT_REFRESH_EXPIRY,CORS_ORIGIN,API_PREFIX,SERVER_NAME
          script: |
            mkdir -p ~/sprout-digital-assessment
            cd ~/sprout-digital-assessment

            # Create production environment file
            cat > .env.prod << EOF
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            NODE_ENV=${NODE_ENV}
            JWT_SECRET=${JWT_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
            JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
            CORS_ORIGIN=${CORS_ORIGIN}
            API_PREFIX=${API_PREFIX}
            SERVER_NAME=${SERVER_NAME}
            EOF

            # Create docker-compose.yml
            cat > docker-compose.yml << 'COMPOSEEOF'
            services:
              db:
                image: postgres:17-alpine
                container_name: sda-db
                restart: unless-stopped
                environment:
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                  POSTGRES_DB: ${POSTGRES_DB}
                  PGDATA: /var/lib/postgresql/data/pgdata
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - sda-network
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 10s

              api:
                image: ${DOCKERHUB_USERNAME}/sprout-digital-assessment-api:latest
                container_name: sda-api
                restart: unless-stopped
                environment:
                  NODE_ENV: ${NODE_ENV}
                  PORT: 3000
                  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
                  JWT_SECRET: ${JWT_SECRET}
                  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
                  JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
                  JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
                  CORS_ORIGIN: ${CORS_ORIGIN}
                  API_PREFIX: ${API_PREFIX}
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - sda-network
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
                command: sh -c "npx prisma migrate deploy && node dist/src/index.js"

              ui:
                image: ${DOCKERHUB_USERNAME}/sprout-digital-assessment-ui:latest
                container_name: sda-ui
                restart: unless-stopped
                depends_on:
                  api:
                    condition: service_healthy
                networks:
                  - sda-network
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 5s

              nginx:
                image: ${DOCKERHUB_USERNAME}/sprout-digital-assessment-nginx:latest
                container_name: sda-nginx
                restart: unless-stopped
                ports:
                  - "8090:80"
                environment:
                  NGINX_ENV: production
                  SERVER_NAME: ${SERVER_NAME}
                  UI_INTERNAL_PORT: 3000
                  API_INTERNAL_PORT: 3000
                depends_on:
                  api:
                    condition: service_healthy
                  ui:
                    condition: service_healthy
                networks:
                  - sda-network
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 10s

            networks:
              sda-network:
                driver: bridge

            volumes:
              postgres_data:
                driver: local
            COMPOSEEOF

            # Login to Docker Hub and deploy
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            docker pull ${DOCKERHUB_USERNAME}/sprout-digital-assessment-api:latest
            docker pull ${DOCKERHUB_USERNAME}/sprout-digital-assessment-ui:latest
            docker pull ${DOCKERHUB_USERNAME}/sprout-digital-assessment-nginx:latest
            docker compose --env-file .env.prod down || true
            docker compose --env-file .env.prod up -d
            sleep 30
            echo "=== Container Status ==="
            docker compose --env-file .env.prod ps
            echo "=== Nginx Logs ==="
            docker compose --env-file .env.prod logs nginx --tail=30
            echo "=== API Logs ==="
            docker compose --env-file .env.prod logs api --tail=30
            docker image prune -af
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRY: ${{ secrets.JWT_ACCESS_EXPIRY }}
          JWT_REFRESH_EXPIRY: ${{ secrets.JWT_REFRESH_EXPIRY }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          API_PREFIX: ${{ secrets.API_PREFIX }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/sprout-digital-assessment
            sleep 45
            docker compose --env-file .env.prod ps
