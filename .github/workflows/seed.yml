name: Database Seeding

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Seed module to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - account
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  seed-database:
    name: Seed Database (${{ github.event.inputs.module }})
    runs-on: ubuntu-latest
    environment: sprout-digital-assessment

    steps:
      - name: Run database seeding on production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          envs: SEED_MODULE
          script_stop: true
          script: |
            set -e
            cd ~/sprout-digital-assessment

            echo "🌱 Running database seeding (module: ${SEED_MODULE})..."

            # Run seeding inside the API container
            # DATABASE_URL is already set in the container's environment via docker-compose
            if [ "${SEED_MODULE}" = "all" ]; then
              docker compose --env-file .env.prod exec -T api node dist/prisma/seeds/index.js
            else
              docker compose --env-file .env.prod exec -T api node dist/prisma/seeds/index.js "${SEED_MODULE}"
            fi

            echo "✅ Seeding completed for module: ${SEED_MODULE}"
        env:
          SEED_MODULE: ${{ github.event.inputs.module }}

      - name: Verify seeding
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          envs: POSTGRES_USER,POSTGRES_DB
          script_stop: true
          script: |
            set -e
            cd ~/sprout-digital-assessment

            docker compose --env-file .env.prod exec -T db psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "SELECT COUNT(*) as total_accounts FROM accounts;"

            echo "✅ Verification completed"
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
